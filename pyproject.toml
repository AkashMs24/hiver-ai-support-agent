[project]
name = "hiver-support-agent"
version = "1.0.0"
description = "AI Customer Support Agent for @AppleSupport — Hiver SDE Intern Assignment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Akash M S", email = "akashms24@example.com"},
]

dependencies = [
    # Data processing
    "pandas>=2.0",
    "numpy>=1.24",

    # Embeddings & Vector Search
    "sentence-transformers>=2.2",
    "faiss-cpu>=1.7",

    # Clustering
    "hdbscan>=0.8",
    "umap-learn>=0.5",

    # Classification & Metrics
    "scikit-learn>=1.3",

    # LLM APIs
    "groq>=0.9",
    "google-generativeai>=0.7",

    # Evaluation
    "rouge-score>=0.1",
    "bert-score>=0.3",

    # CLI & Display
    "rich>=13.0",

    # Utilities
    "python-dotenv>=1.0",
    "tqdm>=4.65",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
]
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.15",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["src*", "eval*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
